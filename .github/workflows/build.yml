name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===== CI 检查：每次 push/PR 都跑，tag push 时作为 build 的前置门禁 =====
  ci:
    # 必须用 macOS：本项目仅支持 macOS（Windows 后续 / Linux 不支持）。
    # `npm run gen:types` 会 `cargo test` 编译整个 crate，在 Linux 上会因
    # tauri 依赖链拉入 gdk-sys（GTK3）而失败：gdk-3.0.pc not found。
    # 换用 ubuntu runner 需要额外 apt 安装 libgtk-3-dev 等一整套 Linux 桌面库，
    # 而这些库与最终 macOS 产物无关，故直接对齐 build 用 macOS。
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      # 必须先产出 dist/：tauri::generate_context!() 在编译期校验
      # tauri.conf.json 的 frontendDist("../dist") 是否存在，缺失会让
      # `cargo test`（gen:types / Rust check / Rust tests 都走它）直接 panic。
      # 直接调 vite 而非 `npm run build`，避免触发 prebuild → gen:types 的循环依赖。
      - name: Build frontend (produces dist/)
        run: npx vite build

      - name: Generate TypeScript types (ts-rs)
        run: npm run gen:types

      - name: Verify generated types are in sync
        run: |
          if [ -n "$(git status --porcelain -- src/types/generated/)" ]; then
            echo "❌ src/types/generated/ 与 Rust 结构体不一致，请在本地运行 'npm run gen:types' 后提交"
            git status --porcelain -- src/types/generated/
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npx vitest run

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ===== 构建：仅 tag push 触发，依赖 CI 通过 =====
  build:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: jlocal-macos-arm64
            artifact-glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Jlocal ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.target }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
